<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tenant Tools: private building page</title>
  <desc id="desc">A private building page. Only residents with the building key can open it.</desc>
  <style>
    @font-face { font-family: "Big Shoulders"; font-weight: 500 900; src: url("../fonts/big-shoulders-latin.woff2") format("woff2"); }
    .d { font-family: "Big Shoulders", "Arial Narrow", sans-serif; text-transform: uppercase; }
    .b { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>
  <rect width="1200" height="630" fill="#F3F4F1"/>
  <rect width="1200" height="92" fill="#151515"/>
  <rect x="64" y="24" width="44" height="44" rx="4" fill="#F3F4F1"/>
  <path fill="#151515" d="M69.5 33h15.8v5.5h-5.2v20.5h-5.5V38.5h-5.1zM86.5 33h15.8v5.5h-5.2v20.5h-5.5V38.5h-5.1z"/>
  <text class="d" x="128" y="61" font-size="38" font-weight="800" letter-spacing="1.5" fill="#F3F4F1">Tenant Tools</text>
  <text class="d" x="64" y="226" font-size="104" font-weight="900" fill="#151515">Private</text>
  <text class="d" x="64" y="322" font-size="104" font-weight="900" fill="#151515">building page</text>
  <text class="b" x="64" y="388" font-size="28" font-weight="500" fill="#363833">Residents with the building key only.</text>
  <text class="b" x="64" y="428" font-size="28" font-weight="500" fill="#363833">No names. No unit numbers.</text>
  <g transform="translate(700 168)">
    <rect y="0" width="436" height="4" fill="#151515"/>
    <text class="d" x="0" y="52" font-size="36" font-weight="800" fill="#151515">Open problems</text>
    <text class="b" x="0" y="86" font-size="24" fill="#363833">Each with its days open.</text>
    <rect y="112" width="436" height="1.5" fill="#8D9088"/>
    <text class="d" x="0" y="164" font-size="36" font-weight="800" fill="#151515">Me too counts</text>
    <text class="b" x="0" y="198" font-size="24" fill="#363833">Small counts stay hidden.</text>
    <rect y="224" width="436" height="1.5" fill="#8D9088"/>
    <text class="d" x="0" y="276" font-size="36" font-weight="800" fill="#151515">Next step</text>
    <text class="b" x="0" y="310" font-size="24" fill="#363833">Unlocks by date.</text>
  </g>
</svg>
