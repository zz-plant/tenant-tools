<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tenant Tools</title>
  <desc id="desc">Put it in writing. Act together. Calm notices, dated records, and a me-too count for neighbors.</desc>
  <style>
    @font-face { font-family: "Big Shoulders"; font-weight: 500 900; src: url("../fonts/big-shoulders-latin.woff2") format("woff2"); }
    .d { font-family: "Big Shoulders", "Arial Narrow", sans-serif; text-transform: uppercase; }
    .b { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>
  <rect width="1200" height="630" fill="#F3F4F1"/>
  <rect width="1200" height="92" fill="#151515"/>
  <rect x="64" y="24" width="44" height="44" rx="4" fill="#F3F4F1"/>
  <path fill="#151515" d="M69.5 33h15.8v5.5h-5.2v20.5h-5.5V38.5h-5.1zM86.5 33h15.8v5.5h-5.2v20.5h-5.5V38.5h-5.1z"/>
  <text class="d" x="128" y="61" font-size="38" font-weight="800" letter-spacing="1.5" fill="#F3F4F1">Tenant Tools</text>
  <text class="d" x="64" y="236" font-size="118" font-weight="900" fill="#151515">Put it in writing.</text>
  <text class="d" x="64" y="342" font-size="118" font-weight="900" fill="#151515">Act together.</text>
  <text class="b" x="64" y="412" font-size="30" font-weight="500" fill="#363833">Calm notices. Dated records. Neighbors say “me too”.</text>
  <rect x="64" y="462" width="340" height="4" fill="#151515"/>
  <text class="d" x="64" y="516" font-size="38" font-weight="800" fill="#151515">Write a notice</text>
  <text class="b" x="64" y="554" font-size="25" fill="#363833">Calm words. No legal terms.</text>
  <rect x="432" y="462" width="340" height="4" fill="#151515"/>
  <text class="d" x="432" y="516" font-size="38" font-weight="800" fill="#151515">Save the dates</text>
  <text class="b" x="432" y="554" font-size="25" fill="#363833">A record of what happened.</text>
  <rect x="800" y="462" width="340" height="4" fill="#151515"/>
  <text class="d" x="800" y="516" font-size="38" font-weight="800" fill="#151515">Me too</text>
  <text class="b" x="800" y="554" font-size="25" fill="#363833">Neighbors join without writing.</text>
</svg>
